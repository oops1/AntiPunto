[package]
name = "antipunto"
version = "0.2.0"
edition = "2024"
description = "Переключатель раскладки RU/EN по смыслу фразы на локальной нейросети"
repository = "https://github.com/oops1/AntiPunto"

[dependencies]
libloading = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
